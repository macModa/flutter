name: nbatna
description: "نباتنا - Application d'identification de plantes en darija tunisienne"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.9
  
  # Firebase
  firebase_core: ^2.24.2
  cloud_firestore: ^4.13.6
  firebase_storage: ^11.5.6
  
  # Image & Camera
  image_picker: ^1.0.5
  
  # Location
  geolocator: ^10.1.0
  
  # HTTP
  http: ^1.1.2
  
  # UUID
  uuid: ^4.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
